

# openEuler publishes ready-made VM qcow2 images (xz-compressed) per release
# under https://repo.openeuler.org/openEuler-<release>/virtual_machine_img/,
# but that origin is server-side rate limited: ~1.1 MB/s on the GHA runner
# and ~1.2 MB/s from a Hong Kong VPS alike, so pulling the ~940 MB image
# burned 13m43s of a 19-minute build. mirrors.aliyun.com serves a
# byte-identical copy (same Content-Length, Range supported -- verified
# for every release/arch this builder uses) and is the only mirror with a
# real overseas CDN edge: an Azure-US client resolves it to a US node
# (163.181.60.x, Atlanta), which is where the CI runners live. Only the
# path prefix differs -- /openeuler/ is prepended.
VM_VHD_LINK="https://mirrors.aliyun.com/openeuler/openEuler-24.03-LTS-SP4/virtual_machine_img/x86_64/openEuler-24.03-LTS-SP4-x86_64.qcow2.xz"
VM_OS_NAME="openeuler"
VM_SSH_PORT=2222
VM_RELEASE=24.03-LTS-SP4

VM_ROOT_PASSWORD=anyvm.org

VM_LOGIN_TAG="login:"

VM_SHUTDOWN_CMD="shutdown -h now"

VM_INSTALL_CMD="dnf install -y "

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"

VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG nfs-utils tar"

VM_NIC=virtio

# The openEuler VM image ships a preset root password we do not rely on:
# hooks/host_prepareImage.sh bakes in root SSH access (and our own root
# password) with virt-customize before the first boot, and sets SELinux to
# permissive so the injected authorized_keys works regardless of labels.
# hooks/host_waitForLoginTag.sh and hooks/host_enablessh.sh then drive the
# rest over SSH, so we stay on the serial console instead of fragile VNC OCR.
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"