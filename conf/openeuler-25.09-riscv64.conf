

# The image is fetched from anyvm-org/openeuler-archive, which re-hosts
# the official openEuler VM images as GitHub release assets -- unmodified
# bytes, with the upstream .sha256sum verified before upload.
#
# Neither upstream source is usable from CI. repo.openeuler.org is
# server-side rate limited: ~1.1 MB/s on the runner, and the same
# ~1.2 MB/s to a VPS a few hundred km from it, so distance is not the
# factor and a closer mirror is not the fix. mirrors.aliyun.com is the
# only mirror with an overseas CDN edge, but it throttles concurrency --
# the very same 940 MB download took 3m50s in one CI run and 22m11s in
# the next. A release asset sits in the same cloud as the runner.
# See https://github.com/anyvm-org/openeuler-archive for the numbers.
# 25.09 is the only first-batch release with a riscv64 image (the LTS lines
# ship no riscv64 VM image). Upstream also publishes RISCV_VIRT_CODE.fd
# beside it (EDK2 UEFI): the image boots via the standard EFI path, which
# build.py's riscv64 u-boot payload reaches through u-boot's EFI fallback
# (same path the ubuntu 24.04/26.04 riscv64 builds use).
VM_VHD_LINK="https://github.com/anyvm-org/openeuler-archive/releases/download/v1.0.0/openEuler-25.09-riscv64.qcow2.xz"
VM_OS_NAME="openeuler"
VM_SSH_PORT=2222
VM_RELEASE=25.09

VM_ROOT_PASSWORD=anyvm.org

VM_LOGIN_TAG="login:"

VM_SHUTDOWN_CMD="shutdown -h now"

VM_INSTALL_CMD="dnf install -y "

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"

# fuse-sshfs DOES exist for riscv64 -- it lives in the EPOL repo, and the
# riscv64 image ships that repo with a wrong baseurl (.../EPOL/$basearch/
# instead of .../EPOL/main/$basearch/, which the x86_64 and aarch64 files
# get right). The bad path 404s the whole repo, so an earlier search that
# only covered the OS and everything indexes concluded the package was
# missing. hooks/vm_postBuild.sh now rewrites that path, which restores
# EPOL and with it fuse-sshfs.
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG nfs-utils tar"

VM_ARCH=riscv64
VM_NIC=virtio

# Under TCG riscv64 emulation on the x86 runner the first sshd cold-start
# can take 30-60 s, so the default 10 s ssh-probe timeout reports every
# retry as "connection timeout" and we never detect that sshd is actually
# answering. Give it 90 s.
VM_SSH_READY_TIMEOUT=90

# The openEuler VM image ships a preset root password we do not rely on:
# hooks/host_prepareImage.sh bakes in root SSH access (and our own root
# password) with virt-customize before the first boot, and sets SELinux to
# permissive so the injected authorized_keys works regardless of labels.
# hooks/host_waitForLoginTag.sh and hooks/host_enablessh.sh then drive the
# rest over SSH, so we stay on the serial console instead of fragile VNC
# OCR. riscv64 is emulated (TCG) on the x86 runner, so the build is slow
# but works.
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"